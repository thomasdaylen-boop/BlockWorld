<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BlockWorld Mobile</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial}#game{width:100%;height:100%;display:block}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#62b8ff,#b9edff);z-index:5}.panel{background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 10px 30px #0003;width:80%;max-width:330px}button{border:0;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:bold;background:#35a853;color:white}#hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;color:white;text-shadow:0 2px 3px #000;font-weight:bold;pointer-events:none}#controls{display:none;position:fixed;inset:0;pointer-events:none}#joy{position:absolute;left:20px;bottom:25px;width:120px;height:120px;border-radius:50%;background:#ffffff55;pointer-events:auto}#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff9}#jump{position:absolute;right:25px;bottom:35px;width:90px;height:90px;border-radius:50%;background:#ffcc33;color:#222;pointer-events:auto}#build{position:absolute;right:130px;bottom:48px;background:#fff;color:#222;padding:12px;border-radius:12px;pointer-events:auto}#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:white;text-shadow:0 2px 3px #000;font-size:13px;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="menu"><div class="panel"><h1>🌎 BlockWorld</h1><p>Baue deine eigene kleine Block-Welt!</p><button id="start">SPIELEN</button></div></div><div id="hud"><span>⭐ Level <b id="level">1</b></span><span>XP: <b id="xp">0</b></span><span>🪙 <b id="coins">50</b></span></div><div id="controls"><div id="joy"><div id="stick"></div></div><button id="jump">⬆️</button><button id="build">🧱 Bauen</button></div><div id="hint">Joystick = bewegen · ⬆️ = springen · Bauen = Block setzen</div><script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>const c=document.getElementById('game'),s=new THREE.Scene();s.background=new THREE.Color(0x87ceeb);s.fog=new THREE.Fog(0x87ceeb,25,70);const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200),r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;s.add(new THREE.HemisphereLight(0xffffff,0x668866,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,30,10);sun.castShadow=true;s.add(sun);const blocks=[],mats={g:new THREE.MeshLambertMaterial({color:0x55aa44}),d:new THREE.MeshLambertMaterial({color:0x8b5a2b}),w:new THREE.MeshLambertMaterial({color:0xa66a32})};function block(x,y,z,t='g'){let m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mats[t]);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;s.add(m);blocks.push(m)}for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){block(x,-1,z,'d');block(x,0,z);if(Math.random()<.07&&Math.abs(x)+Math.abs(z)>5){block(x,1,z,'w');block(x,2,z,'w');block(x,3,z,'w')}}const p=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.65,1,.45),new THREE.MeshLambertMaterial({color:0x3366ff})),head=new THREE.Mesh(new THREE.BoxGeometry(.65,.65,.65),new THREE.MeshLambertMaterial({color:0xffcc99}));body.position.y=1.15;head.position.y=1.95;p.add(body,head);s.add(p);let vy=0,ground=true,jx=0,jy=0,started=false,xp=0,coins=50,level=1;try{let q=JSON.parse(localStorage.bw);if(q){xp=q.xp||0;coins=q.coins||50;level=q.level||1}}catch{}function ui(){for(const [id,v] of [['xp',xp],['coins',coins],['level',level]])document.getElementById(id).textContent=v}ui();function gain(n){xp+=n;if(xp>=level*100){xp-=level*100;level++;coins+=20}ui();localStorage.bw=JSON.stringify({xp,coins,level})}const joy=document.getElementById('joy'),stick=document.getElementById('stick');function mj(e){let q=joy.getBoundingClientRect(),x=e.clientX-q.left-60,y=e.clientY-q.top-60,l=Math.hypot(x,y),a=Math.min(1,42/Math.max(l,1));jx=x*a/42;jy=y*a/42;stick.style.transform=`translate(${x*a}px,${y*a}px)`}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);mj(e)};joy.onpointermove=e=>{if(e.buttons)mj(e)};joy.onpointerup=()=>{jx=jy=0;stick.style.transform='translate(0,0)'};document.getElementById('jump').onclick=()=>{if(ground){vy=8;ground=false}};document.getElementById('build').onclick=()=>{let d=new THREE.Vector3(0,0,-1).applyQuaternion(p.quaternion),q=p.position.clone().add(d.multiplyScalar(2));q.x=Math.round(q.x);q.y=1;q.z=Math.round(q.z);block(q.x,q.y,q.z);gain(5)};document.getElementById('start').onclick=()=>{started=true;document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('controls').style.display='block'};function loop(){requestAnimationFrame(loop);if(started){let sp=.13,dx=jx*sp,dz=jy*sp;if(Math.abs(dx)+Math.abs(dz)>.01){p.rotation.y=Math.atan2(dx,dz);p.position.x+=dx;p.position.z+=dz}vy-=.35;p.position.y+=vy*.08;if(p.position.y<=0){p.position.y=0;vy=0;ground=true}cam.position.lerp(new THREE.Vector3(p.position.x,p.position.y+5,p.position.z+7),.12);cam.lookAt(p.position.x,p.position.y+1,p.position.z)}r.render(s,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
